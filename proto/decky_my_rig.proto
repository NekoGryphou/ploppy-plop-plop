syntax = "proto3";

package deckymyrig.v1;

// The application protocol version. HTTP paths are versioned separately so an
// incompatible peer can return a structured error rather than fail decoding.
message StatusRequest {
  uint32 protocol_version = 1;
  string client_version = 2;
}

message StatusResponse {
  string hostname = 1;
  string host_version = 2;
  uint32 protocol_version = 3;
  bool paired = 4;
  string host_id = 5;
}

// One-message SPAKE2 client initiation. The pairing code is never transmitted.
message PairRequest {
  uint32 protocol_version = 1;
  bytes client_spake2_message = 2;
  bytes session_id = 3;
  bytes client_confirmation = 4;
  string client_version = 5;
}

// encrypted_credential is ChaCha20-Poly1305 ciphertext including its tag.
message PairResponse {
  bytes host_spake2_message = 1;
  bytes encryption_nonce = 2;
  bytes encrypted_credential = 3;
  string hostname = 4;
  string host_version = 5;
  uint32 protocol_version = 6;
  string host_id = 7;
  bytes session_id = 8;
}

message ShutdownRequest {
  uint32 protocol_version = 1;
  string client_version = 2;
}

message ShutdownResponse {
  bool accepted = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHORIZED = 1;
  ERROR_CODE_PAIRING_EXPIRED = 2;
  ERROR_CODE_ALREADY_PAIRED = 3;
  ERROR_CODE_SHUTDOWN_FAILED = 4;
  ERROR_CODE_PROTOCOL_MISMATCH = 5;
  ERROR_CODE_RATE_LIMITED = 6;
  ERROR_CODE_MALFORMED_REQUEST = 7;
  ERROR_CODE_HOST_IDENTITY_MISMATCH = 8;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}
