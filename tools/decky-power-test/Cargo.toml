[package]
name = "decky-power-test"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chacha20poly1305 = "0.11"
decky-power-host = { path = "../../host" }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
spake2 = "0.4"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
