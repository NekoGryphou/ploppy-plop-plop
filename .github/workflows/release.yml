name: Signed release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: decky/package-lock.json }
      - run: npm --prefix decky ci
      - run: ./scripts/decky/build-decky-deps.sh
      - run: npm --prefix decky test
      - run: npm --prefix decky run build
      - run: ./scripts/decky/build-plugin.sh
      - run: npm --prefix decky sbom --package-lock-only --sbom-format cyclonedx > out/plugin/plugin.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plugin
          path: |
            out/plugin/RemotePCPower.zip
            out/plugin/plugin.cdx.json

  windows:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: 8.0.x }
      - uses: crazy-max/ghaction-chocolatey@2526f467ccbd337d307fe179959cabbeca0bc8c0 # v3
        with: { args: install innosetup --yes --no-progress }
      - name: Import release signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) { throw "WINDOWS_CERTIFICATE_BASE64 is required." }
          $path = Join-Path $env:RUNNER_TEMP "release-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "SIGNING_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "REQUIRE_CODE_SIGNING=1" >> $env:GITHUB_ENV
          Remove-Item $path -Force
      - shell: pwsh
        run: ./scripts/windows/build-windows.ps1
      - shell: pwsh
        run: ./scripts/windows/test-windows.ps1
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --manifest-path host/Cargo.toml --format json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            out/host/DeckyPowerHost-Setup.exe
            host/decky-power-host.cdx.json

  publish:
    needs: [plugin, windows]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify tag and build release manifest
        shell: pwsh
        run: |
          $version = (Get-Content decky/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match package version $version." }
          ./scripts/release/create-manifest.ps1 -Version $version -ArtifactDirectory release -Repository $env:GITHUB_REPOSITORY
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/DeckyPowerHost-Setup.exe
            release/RemotePCPower.zip
            release/release-manifest.json
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME release/* --verify-tag --generate-notes --title "Decky My Rig $env:GITHUB_REF_NAME"
