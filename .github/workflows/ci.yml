name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  decky:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: decky }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: decky/package-lock.json }
      - run: npm ci
      - run: ../scripts/build-decky-deps.sh
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run visual
      - run: ../scripts/build-plugin.sh
      - uses: actions/upload-artifact@v4
        with: { name: RemotePCPower-Decky, path: out/plugin/RemotePCPower.zip }

  windows-host:
    runs-on: windows-latest
    defaults:
      run: { working-directory: host }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force out/host | Out-Null
          Copy-Item host/target/x86_64-pc-windows-msvc/release/decky-power-host.exe out/host/DeckyPowerHost.exe
      - uses: crazy-max/ghaction-chocolatey@v3
        with: { args: install innosetup --yes --no-progress }
      - shell: pwsh
        working-directory: .
        run: iscc host/installer/DeckyPowerHost.iss
      - uses: actions/upload-artifact@v4
        with:
          name: DeckyPowerHost-Windows
          path: |
            out/host/DeckyPowerHost.exe
            out/host/DeckyPowerHost-Setup.exe
