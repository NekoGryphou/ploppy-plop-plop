name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: decky/package-lock.json }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: cargo install cargo-audit --locked
      - run: npm --prefix decky ci
      - run: ./scripts/decky/build-decky-deps.sh
      - run: REQUIRE_DOCKER=1 ./scripts/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RemotePCPower
          path: out/plugin/RemotePCPower.zip

  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: 8.0.x }
      - uses: crazy-max/ghaction-chocolatey@2526f467ccbd337d307fe179959cabbeca0bc8c0 # v3
        with: { args: install innosetup --yes --no-progress }
      - shell: pwsh
        run: ./scripts/windows/build-windows.ps1
      - shell: pwsh
        run: ./scripts/windows/test-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeckyPowerHost-Windows
          path: |
            out/host/DeckyPowerHost.exe
            out/host/DeckyPowerHost-Setup.exe
            out/control/**
