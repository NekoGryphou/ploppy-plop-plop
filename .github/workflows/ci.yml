name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Metadata and generated protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-metadata.sh

  dependency-security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: decky/package-lock.json }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.98.0 }
      - run: cargo install cargo-audit --locked
      - run: ./scripts/check-security.sh

  plugin-lint:
    name: Plugin lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: decky/package-lock.json }
      - run: npm --prefix decky ci
      - run: npm --prefix decky run lint

  plugin-frontend-tests:
    name: Plugin frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: decky/package-lock.json }
      - run: npm --prefix decky ci
      - run: npm --prefix decky run test:frontend

  plugin-backend-tests:
    name: Plugin backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: decky/package-lock.json }
      - run: npm --prefix decky ci
      - run: ./scripts/decky/build-decky-deps.sh
      - run: npm --prefix decky run test:backend

  plugin-package:
    name: Plugin package
    needs: [metadata, plugin-lint, plugin-frontend-tests, plugin-backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: decky/package-lock.json }
      - run: npm --prefix decky ci
      - run: ./scripts/decky/build-decky-deps.sh
      - run: ./scripts/decky/build-plugin.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DekyMyRig_Plugin
          path: out/plugin/DekyMyRig_Plugin.zip

  host-format:
    name: Host formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.98.0, components: rustfmt }
      - run: cargo fmt --manifest-path host/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path tools/decky-my-rig-test/Cargo.toml --all -- --check

  host-static-analysis:
    name: Host static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.98.0, components: clippy }
      - run: cargo clippy --manifest-path host/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path tools/decky-my-rig-test/Cargo.toml --all-targets -- -D warnings

  host-windows-cross-check:
    name: Host Windows cross-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.98.0, targets: x86_64-pc-windows-msvc }
      - run: cargo check --manifest-path host/Cargo.toml --target x86_64-pc-windows-msvc --all-targets

  host-unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.98.0 }
      - run: cargo test --manifest-path host/Cargo.toml --all-targets
      - run: cargo build --manifest-path host/Cargo.toml
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ci-linux-host-${{ github.run_id }}
          path: host/target/debug/decky-my-rig-host

  protocol-client-tests:
    name: Protocol client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.98.0 }
      - run: cargo test --manifest-path tools/decky-my-rig-test/Cargo.toml --all-targets
      - run: cargo build --manifest-path tools/decky-my-rig-test/Cargo.toml
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ci-linux-protocol-client-${{ github.run_id }}
          path: tools/decky-my-rig-test/target/debug/decky-my-rig-test

  host-lifecycle-tests:
    name: Host lifecycle and multi-PC tests
    needs: host-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ci-linux-host-${{ github.run_id }}
          path: host/target/debug/decky-my-rig-host
      - run: chmod +x host/target/debug/decky-my-rig-host
      - run: ./scripts/decky/build-decky-deps.sh
      - run: PYTHONPATH=decky/py_modules python3 -B -m unittest decky.tests.e2e.test_lifecycle decky.tests.e2e.test_multi_pc -v

  protocol-integration:
    name: Cross-language protocol integration
    needs: [host-unit-tests, protocol-client-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ci-linux-host-${{ github.run_id }}
          path: host/target/debug/decky-my-rig-host
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ci-linux-protocol-client-${{ github.run_id }}
          path: tools/decky-my-rig-test/target/debug/decky-my-rig-test
      - run: chmod +x host/target/debug/decky-my-rig-host tools/decky-my-rig-test/target/debug/decky-my-rig-test
      - run: ./scripts/decky/build-decky-deps.sh
      - run: ./scripts/protocol/test-e2e.sh
      - run: ./scripts/decky/test-decky-my-rig-host-integration.sh

  network-fault-tests:
    name: Network fault and recovery tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/decky/build-decky-deps.sh
      - run: REQUIRE_DOCKER=1 ./scripts/check-network.sh

  windows-host:
    name: Windows host build, tests, and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 8.0.x }
      - uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
        with: { args: install innosetup --yes --no-progress }
      - shell: pwsh
        run: ./scripts/windows/build-windows.ps1
      - shell: pwsh
        run: ./scripts/windows/test-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DeckyMyRig_Host__Windows_x64
          path: |
            out/host/DeckyMyRigHost.exe
            out/host/DeckyMyRig_Host__Windows_x64.exe
            out/control/**
