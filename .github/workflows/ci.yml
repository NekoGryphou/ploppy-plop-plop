name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: decky/package-lock.json }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: cargo install cargo-audit --locked
      - run: npm --prefix decky ci
      - run: ./scripts/decky/build-decky-deps.sh
      - run: REQUIRE_DOCKER=1 ./scripts/check.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DekyMyRig_Plugin
          path: out/plugin/DekyMyRig_Plugin.zip

  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 8.0.x }
      - uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
        with: { args: install innosetup --yes --no-progress }
      - shell: pwsh
        run: ./scripts/windows/build-windows.ps1
      - shell: pwsh
        run: ./scripts/windows/test-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DeckyMyRig_Host__Windows_x64
          path: |
            out/host/DeckyMyRigHost.exe
            out/host/DeckyMyRig_Host__Windows_x64.exe
            out/control/**
